name: Test and publish
on:
  push: { branches: [main, "quality/**"] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
      - run: npm test && npm run build
      - uses: actions/setup-python@v5
        with:
          {
            python-version: "3.12",
            cache: pip,
            cache-dependency-path: worker/requirements.txt,
          }
      - run: pip install -r worker/requirements.txt
      - run: python tests/pdf_test.py
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python3 tests/integration.py
      - run: python3 tests/broker_restart.py
      - run: python3 tests/broker_restart.py --recreate
      - if: always()
        run: docker compose logs && docker compose down -v
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
